  - case_id: anz_1h25_period_document_not_ingested
    bank: ANZ
    period: 1H25
    metric: nim
    as_of: 2026-05-31
    categories: [real_filing, period_document_not_ingested]
    expected_status: [ABSTAIN]
    expected_abstain_reason: DOCS_UNAVAILABLE
    # With a model the cold path finds ANZ's own 1H25 results document and answers from it,
    # which is the right outcome; only without one must the run abstain.
    with_model:
      expected_status: [OK, PARTIAL]
    notes: >-
      1H25 appears in the corpus only as the comparative column of the 1H26 pack; ANZ's own
      1H25 results document was never ingested. Having the figure is not the same as having
      the disclosure, and the abstention must name the period whose document is missing
      rather than answer from a comparative column. Distinct from the cold-path cases,
      where the issuer has no ingested documents at all.

