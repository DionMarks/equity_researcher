# Behavioural cases: the four majors' six metrics for 2026 and for their 2025 full years,
# Judo's six, and the abstention and robustness rows. 55 carry gold read off the page each
# figure cites, marked `labeller_kind: automated` until a person checks it, so for now they
# are a regression baseline rather than an independent holdout.
cases:
  # --- standard: ANZ 1H26 vs 1H25 ----------------------------------------
  - case_id: anz_1h26_nim
    bank: ANZ
    period: 1H26
    metric: nim
    as_of: 2026-05-31
    categories: [standard, real_filing, walk_or_identity]
    expected_status: [OK, PARTIAL]
    notes: >-
      ANZ publishes its margin walk as a chart rather than a table. Without a model to
      read it the identity is the only path, and the identity alone is arithmetic, so
      the expected behaviour is a reconciled movement with no economic driver claimed.
    gold_verified: true
    labeller: "automated"
    labeller_kind: automated
    gold:
      current: {value: "1.53", unit: pct, tolerance: "0.005",
                source: {doc_id: anz-1h26-results-document, page: 10}}
      prior: {value: "1.56", unit: pct, tolerance: "0.005",
                source: {doc_id: anz-1h26-results-document, page: 10}}
      change: {value: "-3.00", unit: bps, tolerance: "0.5"}
      drivers: []
      must_mention: []
      materiality: "2"

  - case_id: anz_1h26_cet1
    bank: ANZ
    period: 1H26
    metric: cet1_ratio
    as_of: 2026-05-31
    categories: [standard, real_filing]
    expected_status: [OK, PARTIAL]
    gold_verified: true
    labeller: "automated"
    labeller_kind: automated
    gold:
      current: {value: "12.4", unit: pct, tolerance: "0.005",
                source: {doc_id: anz-1h26-results-document, page: 11}}
      prior: {value: "11.8", unit: pct, tolerance: "0.005",
                source: {doc_id: anz-1h26-results-document, page: 11}}
      change: {value: "60.0", unit: bps, tolerance: "0.5"}
      drivers:
        - {driver_id: cet1.capital, contribution: "48.1", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 118}}
        - {driver_id: cet1.rwa, contribution: "12.9", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 11}}
      # ANZ's own walk, chained: September 2025 against March 2025 on
      # anz-fy25-results-document p.43 (+71 cash profit, -19 significant items, -45
      # dividend, +14 underlying RWA, -18 operational risk and IRRBB, +22 capital floor),
      # then March 2026 against September 2025 on p.40 here (+81 cash profit, +22 NOHC
      # reinvestment, -33 dividend, -19 underlying RWA, +7 deductions, -24 IRRBB, +2 capital
      # floor). Three lines have no single driver id and are summed as other: -19, -18, +22.
      walk_drivers:
        - {driver_id: cet1.organic_capital, contribution: "152", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 40}}
        - {driver_id: cet1.dividends, contribution: "-78", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 40}}
        - {driver_id: cet1.regulatory, contribution: "24", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 40}}
        - {driver_id: cet1.rwa_irrbb, contribution: "-24", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 40}}
        - {driver_id: cet1.other, contribution: "-15", tolerance: "1",
           source: {doc_id: anz-fy25-results-document, page: 43}}
        - {driver_id: cet1.deductions_other, contribution: "7", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 40}}
        - {driver_id: cet1.rwa_credit, contribution: "-5", tolerance: "1",
           source: {doc_id: anz-1h26-results-document, page: 40}}
      materiality: "2"

