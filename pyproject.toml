[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankresearch"
version = "0.1.0"
description = "Bank equity research agent: explains a headline metric's movement against the prior corresponding period, with cited, confidence-rated driver attribution"
readme = "README.md"
# Tested on 3.12, 3.13 and 3.14 (CI runs all three). 3.15 is capped until the pinned
# dependencies publish wheels for it, so pip says so up front instead of failing halfway
# through a source build.
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# PDF parsing. Kept separate so the core can be installed and tested without the
# native wheels.
pdf = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]
# The Anthropic SDK, for the model-backed steps. Without it those steps are skipped.
llm = [
    "anthropic>=0.40",
]
dev = [
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
bankresearch = "bankresearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bankresearch = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # Our own deprecations are errors; third-party ones we cannot fix are not.
    "error::DeprecationWarning:bankresearch.*",
    # pdfplumber's SWIG bindings, raised at import time.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# In an assertion, naming the expected constant first is the clearer reading;
# ruff's Yoda-condition heuristic does not distinguish that from a comparison.
"tests/**" = ["SIM300"]

# mypy --strict on the deterministic cores only.
[tool.mypy]
python_version = "3.12"
packages = ["bankresearch"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "bankresearch.domain.*",
    "bankresearch.decomposition.*",
    "bankresearch.reconcile.*",
    "bankresearch.confidence.*",
]
strict = true
