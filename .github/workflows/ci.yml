# Lint, types, tests, import contracts and an eval smoke run on every push, on each
# supported Python. Everything runs with no API key: the smoke split uses the
# committed synthetic fixture, so a push is still checked against a real parse, real
# identity checks and a real rendered memo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo and upload an artifact.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 October 2026. The
    # build is known to work here; move the pin deliberately, with a green run to show for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # Same pinned versions as `make setup`, so CI tests what a new clone installs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev,pdf,llm]"

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Types
        run: python -m mypy

      # Agent code must not import the eval harness or read old runs, and the
      # deterministic core must not import the model layer.
      - name: Import contracts
        run: lint-imports

      # A known vulnerability in a pinned dependency fails the build. Once is enough.
      - name: Dependency audit
        if: matrix.python-version == '3.12'
        run: python -m pip_audit --progress-spinner off --skip-editable

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: Config verification status
        run: python -m bankresearch.cli config-check || true

      # The fixture is rebuilt from its generator and compared with the committed file,
      # so a generator change that wasn't committed fails here instead of leaving the
      # tests checking a file the code no longer produces.
      - name: Regenerate the test fixture
        run: |
          python tests/fixtures/make_fixture_pdf.py
          git diff --exit-code --stat tests/fixtures/ \
            || (echo "::error::the regenerated fixture differs from the committed one" && exit 1)

      # An answer needs the model, which CI has no key for. The fixture is read and checked
      # here, and the eval smoke run below takes it through every step that needs no model.
      - name: Read the fixture
        run: |
          python -m bankresearch.cli ingest \
            --path tests/fixtures/synthetic_results_document.pdf \
            --bank XMPL --period 1H26 --publish-date 2026-05-01
          python -m bankresearch.cli facts --bank XMPL --period 1H26

      - name: Eval smoke
        run: python -m bankresearch.cli eval --split smoke

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ matrix.python-version }}
          path: evals/results/

  # The same tests and fixture run on Windows, so a path, encoding or shell assumption that
  # only holds on Linux and macOS fails here.
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev,pdf,llm]"

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: Read the fixture
        run: |
          python -m bankresearch.cli ingest --path tests/fixtures/synthetic_results_document.pdf --bank XMPL --period 1H26 --publish-date 2026-05-01
          python -m bankresearch.cli facts --bank XMPL --period 1H26

      - name: Eval smoke
        run: python -m bankresearch.cli eval --split smoke

  # Builds the image and checks it starts and answers, so a broken Dockerfile shows up
  # here rather than on someone's machine.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t bankresearch .
      - name: Smoke
        run: |
          docker run --rm bankresearch config-check
          docker run --rm bankresearch resolve --bank ANZ --period 1H26 --metric nim --as-of 2026-05-31
